name: Windows exe

on:
  push:
    branches: [main]
    paths: [app/**, web/**, tools/build_web.py, VERSION, requirements.txt, preklizka.spec, .github/workflows/exe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verze
        id: v
        shell: bash
        run: |
          echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Sestavit exe
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller==6.11.1
          python tools/build_web.py
          pyinstaller --noconfirm preklizka.spec
          report() { echo "::error title=$1::$( (cat dist/selftest.log; echo; echo '--- Preklizka.log'; tail -c 3000 dist/Preklizka.log) 2>&1 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; }
          ./dist/Preklizka.exe --selftest > dist/out.txt 2>&1 &
          for i in $(seq 1 60); do sleep 2; tasklist | grep -qi preklizka || break; done
          { echo "--- procesy po $((i*2)) s:"; tasklist //V | grep -i preklizka || true; echo "--- stdout:"; cat dist/out.txt; } >> dist/selftest.log 2>&1
          if tasklist | grep -qi preklizka; then report "selftest visí"; taskkill //F //IM Preklizka.exe; exit 1; fi
          cat dist/selftest.log
          timeout 400 ./dist/Preklizka.exe --selftest --ai || { report "selftest AI ($?)"; exit 1; }
          cat dist/selftest.log
          rm -rf dist/Preklizka_modely dist/selftest.log
      - name: Vydat verzi
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Překližkové vrstvy v${{ steps.v.outputs.version }}
          files: dist/Preklizka.exe
          body: |
            Stáhni **Preklizka.exe** a spusť (bez instalace). Appka se otevře ve vlastním okně.
            AI funkce (pozadí, výběr kliknutím, zvětšení, fotka → kreslený obrázek) si modely stáhnou při prvním použití do složky Preklizka_modely vedle exe.
            Počítá na grafické kartě (NVIDIA, AMD i Intel přes DirectML), jinak na procesoru.
            Další verze nainstaluješ tlačítkem **Aktualizovat** přímo v appce.
